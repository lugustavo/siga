# Uma pesquisa por bloco. Textos (sem distinguir acentos/maiusculas) ou ids numericos.
# auto_book: false = so avisa por Telegram; true = marca sozinho (ver DRY_RUN no .env).

# Local de teste (Obidos): so avisa, nunca marca.
- search:
    title: 'CC Obidos (teste)'
    auto_book: false
    entity_opt: 'IRN Registo'
    service_opt:
      tema: 'Cidadão'
      subtema: 'Cartão de Cidadão - Pedido/Renovação'
      motivo: 'Pedido/Renovação de Cartão de Cidadão'
      qtd_casos: 1
    location_opt:
      distrito: 'Leiria'
      localidade: 'Óbidos'
      local_atendimento: 'CRCPCom Óbidos'
    max_days: 90
    frequency: 5

# Alvo real: Sintra.
- search:
    title: 'CC Sintra'
    auto_book: false          # passar a true quando quiseres que marque sozinho
    urgency: MAX              # MAX = o mais cedo | MED = o do meio | MIN = o mais tarde
    start_time: '07:00'       # horas do dia em que a pesquisa corre
    end_time: '23:59'
    slot_start: '00:00'       # janela horaria aceite para o atendimento
    slot_end: '23:59'
    max_days: 60
    frequency: 3              # minutos entre verificacoes (2 a 120)
    entity_opt: 'IRN Registo'
    service_opt:
      tema: 'Cidadão'
      subtema: 'Cartão de Cidadão - Pedido/Renovação'
      motivo: 'Pedido/Renovação de Cartão de Cidadão'
      qtd_casos: 1
    location_opt:
      distrito: 'Lisboa'
      localidade: 'Sintra'
      local_atendimento: 'CRC Sintra'
